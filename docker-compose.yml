services:
  db:
    image: postgres:latest
    container_name: charity_db
    environment:
      POSTGRES_DB: charity_event
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ${DB_DATA_PATH:-./postgres_data}:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: CheckInApi/Dockerfile
    container_name: charity_app
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=charity_event;Username=postgres;Password=password
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=80
      - ASPNETCORE_HTTPS_PORTS=443
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ${EXPORT_PATH:-./drive}:/app/drive
    depends_on:
      db:
        condition: service_healthy
