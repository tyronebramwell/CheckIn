services:
  db:
    image: postgres:latest
    container_name: charity_db
    environment:
      POSTGRES_DB: charity_event
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ${DB_DATA_PATH:-./postgres_data}:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: CheckInApi/Dockerfile
    container_name: charity_api
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=charity_event;Username=postgres;Password=password
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ALLOW_PUBLIC_REGISTRATION=${ALLOW_PUBLIC_REGISTRATION:-false}
    volumes:
      - ${EXPORT_PATH:-./drive}:/app/drive
    depends_on:
      db:
        condition: service_healthy

  ui:
    build:
      context: .
      dockerfile: CheckIn/Dockerfile
    container_name: charity_ui
    environment:
      - API_BASE_URL=${API_BASE_URL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs
    depends_on:
      - api
