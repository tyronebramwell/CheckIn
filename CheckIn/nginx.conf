server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    # Global root for all locations
    root /usr/share/nginx/html;
    index index.html;

    # Include default mime types
    include /etc/nginx/mime.types;
    
    # Overrides and additions
    types {
        application/wasm wasm;
        application/octet-stream clr;
        application/octet-stream dll;
        application/octet-stream dat;
    }

    # 1. API requests first
    location /api/ {
        proxy_pass http://api:80/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 2. Strict resolution for static assets (prevents index.html fallback)
    location ~* \.(js|css|wasm|dll|pdb|dat|json|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 3. SPA routing for everything else
    location / {
        try_files $uri $uri/ /index.html;
        
        # Disable caching for index.html to ensure app updates work
        if ($uri ~* "index\.html$") {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    gzip on;
    gzip_static on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;
}
