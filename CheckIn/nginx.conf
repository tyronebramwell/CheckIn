server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    # Always use these filenames. The entrypoint script will ensure they exist.
    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    # Include default mime types
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
        application/octet-stream clr;
        application/octet-stream dll;
        application/octet-stream pdb;
        application/octet-stream dat;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Explicitly handle framework files to prevent falling back to index.html
    location ~ ^/_framework/ {
        root /usr/share/nginx/html;
        
        # Disable caching for boot config to ensure updates are detected
        location ~ \.json$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
        
        try_files $uri =404;
    }

    # Static assets fallback to 404 instead of index.html
    location ~ \.(js|css|wasm|dll|pdb|dat|json|png|jpg|jpeg|gif|ico|svg)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api:80/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # Enable compression
    gzip on;
    gzip_static on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;
    }