server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    # Set root at the server level so all locations inherit it correctly
    root /usr/share/nginx/html;
    index index.html;

    # Include default mime types
    include /etc/nginx/mime.types;
    
    # Critical Blazor WASM types
    types {
        application/wasm wasm;
        application/octet-stream clr;
        application/octet-stream dll;
        application/octet-stream pdb;
        application/octet-stream dat;
        application/json json;
    }

    location / {
        try_files $uri $uri/ /index.html;
        
        # Disable caching for the main page and boot config
        if ($uri ~* "index\.html|blazor\.boot\.json$") {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # Use ^~ to ensure this block takes precedence over regex blocks and handles framework files strictly
    location ^~ /_framework/ {
        gzip_static on;
        try_files $uri =404;
    }

    # Static assets fallback to 404 instead of index.html
    location ~* \.(js|css|wasm|dll|pdb|dat|json|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        gzip_static on;
        try_files $uri =404;
    }

    # API Proxy
    location /api/ {
        proxy_pass http://api:80/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    gzip on;
    gzip_static on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;
}
